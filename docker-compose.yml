services:
  postgres:
    image: postgres:16-alpine
    container_name: namesranker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: namesranker
      POSTGRES_PASSWORD: namesranker
      POSTGRES_DB: namesranker
    ports:
      - "5432:5432"
    volumes:
      - namesranker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namesranker -d namesranker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: namesranker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  namesranker-pgdata:
