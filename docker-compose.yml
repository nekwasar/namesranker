services:
  postgres:
    image: postgres:16-alpine
    container_name: namesranker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: namesranker
      POSTGRES_PASSWORD: namesranker
      POSTGRES_DB: namesranker
    ports:
      - "5432:5432"
    volumes:
      - namesranker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namesranker -d namesranker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Image tag produced by the build step (see README/comments in Dockerfile).
    image: namesranker-app:latest
    container_name: namesranker-app
    restart: unless-stopped
    # Production values come from the gitignored .env.production (no E2E/dev flags).
    env_file:
      - .env.production
    expose:
      - "3000"
    volumes:
      # Persistent user uploads (avatars, imported media) on the host, kept out
      # of the image so container rebuilds never wipe uploaded files.
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/robots.txt >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      # The shared Caddy reverse proxy (agentsdb-prod project) owns host ports
      # 80/443; joining its network lets it reach us as `namesranker-app:3000`.
      - caddy

networks:
  caddy:
    external: true
    name: agentsdb-prod_default

volumes:
  namesranker-pgdata: