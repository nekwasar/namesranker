name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: E2E tests (chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: namesranker
          POSTGRES_PASSWORD: namesranker
          POSTGRES_DB: namesranker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U namesranker -d namesranker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://namesranker:namesranker@localhost:5432/namesranker?schema=public

      - name: Seed keywords and demo profiles
        run: |
          npm run db:seed
          npm run db:seed:demo
        env:
          DATABASE_URL: postgresql://namesranker:namesranker@localhost:5432/namesranker?schema=public

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npx playwright test --project=chromium --workers=1
        env:
          DATABASE_URL: postgresql://namesranker:namesranker@localhost:5432/namesranker?schema=public
          NEXTAUTH_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
